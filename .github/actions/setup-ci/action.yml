name: setup-ci
description: Node 24, Bun, pnpm bootstrap, FoxGuard and a frozen-lockfile install for the self-hosted runner.
inputs:
  cache-maintenance:
    description: Run npm cache verify and pnpm store prune (only in the job that runs before its siblings).
    default: "0"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        # pnpm is installed by Bootstrap runner, after Node is available.
        package-manager-cache: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.3.14"
    - name: Bootstrap runner
      shell: bash
      env:
        ZERO_CI_CACHE_MAINTENANCE: ${{ inputs.cache-maintenance }}
      run: bash "$GITHUB_WORKSPACE/scripts/ci-runner-bootstrap.sh"
    - name: Provision FoxGuard binary
      shell: bash
      env:
        INSTALL_DIR: ${{ runner.temp }}/0-tools/bin
      run: |
        bash "$GITHUB_WORKSPACE/scripts/provision-foxguard.sh"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
    - name: Install dependencies
      shell: bash
      # The package registry sometimes times out from the runners: retry with backoff.
      run: |
        for attempt in 1 2 3 4 5; do
          pnpm install --frozen-lockfile --fetch-retries 5 --fetch-retry-mintimeout 10000 && exit 0
          echo "::warning::pnpm install failed (attempt ${attempt}/5); retrying"
          sleep $((attempt * 15))
        done
        exit 1
