# Dependency updates and security fixes. Third-party GitHub Actions are pinned
# by commit SHA (with the tag in a comment); the github-actions ecosystem below
# keeps those pins current. Replaces the retired Dependency Security workflow
# (npm audit now runs as a non-blocking Main job; Python and Rust audits live in
# 0verse.yml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The SAML guard in enterprise/src/saml/ and the signature check in @node-saml/node-saml and xml-crypto must parse
      # with one and the same xmldom. Both libraries require ^0.8, so 0.9 would give the guard and the verifier two
      # different parsers, the gap signature-wrapping attacks use. Patch updates stay on. Lift this when both libraries
      # accept 0.9; scripts/check-enterprise-boundary.mjs fails if the lockfile ever holds two xmldom lines.
      - dependency-name: "@xmldom/xmldom"
        update-types: [version-update:semver-minor, version-update:semver-major]
      # Grammar ABI must match the vendored tree-sitter 0.21.1 runtime.
      - dependency-name: tree-sitter-c
        update-types: [version-update:semver-minor, version-update:semver-major]
  - package-ecosystem: cargo
    # The Foxguard engine (crates/foxguard). The compiler is pinned in rust-toolchain.toml.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup-ci]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # A new Node major is a project decision (corepack is gone in 25+, CI and engines are on 24).
      - dependency-name: node
        update-types: [version-update:semver-major]
      # The foxguard-builder stage installs the compiler pinned in rust-toolchain.toml, so a base-image bump changes nothing.
      - dependency-name: rust
