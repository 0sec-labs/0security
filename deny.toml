# cargo-deny policy for the advisory audit in .github/workflows/0verse.yml.
# No advisory is ignored except the one below.
[advisories]
ignore = [
    # unsafe-libyaml is unmaintained (no known vulnerability) and comes in through
    # serde_yaml_ng, which Foxguard uses to read rule and config YAML and which has
    # no newer release. Remove this entry when Foxguard moves to a maintained YAML
    # parser.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained, no vulnerability; only reachable through serde_yaml_ng in crates/foxguard" },
]
