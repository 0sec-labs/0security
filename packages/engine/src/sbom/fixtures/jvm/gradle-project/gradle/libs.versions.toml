[versions]
jackson = "2.15.2"
okhttp = { strictly = "4.12.0" }
junit = "5.10.1"
dynamic = "1.+"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
guava = "com.google.guava:guava:30.0-jre" # locked to 32.1.3-jre by gradle.lockfile
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
dyn = { module = "org.example:dyn", version.ref = "dynamic" }
no-version = { module = "org.example:managed" }
missing-ref = { module = "org.example:missing-ref", version.ref = "nope" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version = "1.9.20" }
