id: java-security-fix
name: "Fix a Java security finding with regression checks"
description: "Fix a source-level Java security finding with a small change and targeted regression tests. Used by the explicit Java verification profile; the caller, rather than the model, runs Maven checks in a pinned JDK container."
summary: "Fix Java security flaws and write regression checks for the caller's verifier."
