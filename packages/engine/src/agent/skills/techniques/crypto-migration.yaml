id: crypto-migration
name: "Cryptography inventory and migration plan"
description: "Inventory every cryptographic use in a folder and plan a migration to a named target, such as replacing RSA, ECDH or ECDSA with a post-quantum or hybrid scheme (ML-KEM, ML-DSA) or replacing SHA-1, MD5, DES, ECB mode, static IVs and hardcoded keys. Records one finding per site with a concrete minimal replacement, and ends with a migration plan covering interoperability, key and data migration, versioned formats, hybrid mode and tests. Use when asked to migrate cryptography, prepare for post-quantum, or retire a weak algorithm."
