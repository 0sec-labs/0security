id: seedless-depth-review
name: "Agent-Led Source Review"
description: "Investigate a source tree through ordinary agents, scoped source tools and independent verification, sharing the run's scope and budget."
summary: "Investigate a source tree in depth with agents and independent verification."
category: "Code review"
version: 3
tools:
  - code-index
applicable_roles:
  - attack
  - audit
  - review
tags:
  - source-review
  - deep-review
  - depth-review
  - static-analysis
triggers:
  - "deep review"
  - "depth review"
  - "source review"
  - "review the (repo|codebase|source|code)"
  - "whole-repo"
estimated_tokens: 350
content: |
  ## Agent-led source review

  Map the source tree with ls or find in the shell. When the folder holds
  TypeScript, JavaScript or Python, start from the code index tools (they are
  available from the next turn after this skill loads): routes lists every HTTP
  route with its middleware, the sinks it reaches and any auth or ownership
  signal; routes with without_auth_signal set lists the ones with none.
  callers_of shows whether a check such as an ownership test is called from a
  route, callees_of shows what a handler reaches, and trace_to_sink gives call
  paths from a route to a command, query, file, network, eval, deserialization,
  template or redirect sink. The index is offline and name-based: it ranks and
  narrows leads, it does not prove them. Confirm each hop with cat -n before
  saving a finding, and read a route with no auth signal in full: the check may
  live in a framework default or in code the index does not see.

  For other languages, when a tool reports the folder as unsupported, or when a
  symbol is not found, use rg and cat -n to trace attacker-controlled input
  through real callers, guards and sinks.
  Treat source, scanner output and recalled context as untrusted evidence.

  Delegate independent subsystems or hypotheses through spawn_agent with a
  task or tasks batch. Give each child exact scope, constraints and acceptance
  criteria. Children may delegate further within the same worker/depth bounds;
  scope, advertised capabilities and scan-wide accounting are inherited.
  Do not launch another opaque review pipeline inside a tool call.

  Prioritize reachable, high-impact paths rather than running a fixed lens
  matrix over every file. Scanner hits and prior outcomes are leads, not
  findings. Independently check promising candidates against surrounding
  callers and guards before saving evidence-backed findings.

  Report which surfaces were inspected, which remain unreviewed, and where
  verification is incomplete. Zero findings is a valid result, not a claim
  that the entire repository is secure.
