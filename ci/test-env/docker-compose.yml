# A Bitbucket Data Center and Jenkins pair for trying the CI recipes on your own machine.
# Nothing here has been started by the authors. Versions are the tags published on Docker Hub on 2026-11-23.
#
#   export BITBUCKET_LICENSE=...        # a Data Center trial license from https://my.atlassian.com
#   export BITBUCKET_ADMIN_PASSWORD=... # the first administrator's password
#   export POSTGRES_PASSWORD=...
#   docker compose -f ci/test-env/docker-compose.yml up -d
#
# Bitbucket: http://localhost:7990   Jenkins: http://localhost:8080   Git over SSH: port 7999
# All ports are bound to this machine only. The setup variables follow the automated-setup properties in Atlassian's
# documentation (setup.baseUrl becomes SETUP_BASEURL); check them against the Bitbucket version you run.
name: zero-ci-test-env

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bitbucket
      POSTGRES_USER: bitbucket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitbucket -d bitbucket"]
      interval: 5s
      timeout: 5s
      retries: 20

  bitbucket:
    image: atlassian/bitbucket:9.4.14-ubi9-jdk21
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:7990:7990"
      - "127.0.0.1:7999:7999"
    environment:
      JDBC_DRIVER: org.postgresql.Driver
      JDBC_URL: jdbc:postgresql://db:5432/bitbucket
      JDBC_USER: bitbucket
      JDBC_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SETUP_DISPLAYNAME: 0 test Bitbucket
      SETUP_BASEURL: http://localhost:7990
      SETUP_LICENSE: ${BITBUCKET_LICENSE:?set BITBUCKET_LICENSE}
      SETUP_SYSADMIN_USERNAME: admin
      SETUP_SYSADMIN_PASSWORD: ${BITBUCKET_ADMIN_PASSWORD:?set BITBUCKET_ADMIN_PASSWORD}
      SETUP_SYSADMIN_DISPLAYNAME: Administrator
      SETUP_SYSADMIN_EMAILADDRESS: admin@example.com
    volumes:
      - bitbucket-data:/var/atlassian/application-data/bitbucket

  jenkins:
    image: jenkins/jenkins:2.580.2-lts-jdk21
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins-data:/var/jenkins_home

volumes:
  db-data:
  bitbucket-data:
  jenkins-data:
