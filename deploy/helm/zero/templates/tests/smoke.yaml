apiVersion: v1
kind: Pod
metadata:
  name: {{ include "zero.fullname" . }}-smoke
  labels:
    app.kubernetes.io/name: {{ include "zero.name" . }}-smoke
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: smoke
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: smoke
      image: {{ include "zero.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      # Reaches the console through its Service. The Host header names an allowed host.
      command:
        - sh
        - -c
        - >-
          curl -fsS -H 'Host: localhost'
          http://{{ include "zero.fullname" . }}:{{ .Values.service.port }}/readyz
