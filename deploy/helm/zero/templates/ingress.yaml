{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.host is required when ingress.enabled is true" }}
{{- end }}
{{- if and (not .Values.ingress.tlsSecretName) (not .Values.ingress.tlsTerminatedUpstream) }}
{{- fail "Set ingress.tlsSecretName, or set ingress.tlsTerminatedUpstream=true when your load balancer terminates TLS and blocks plain HTTP. The console sends its access token and session cookie in every request." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zero.fullname" . }}
  labels:
    {{- include "zero.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "zero.fullname" . }}
                port:
                  name: http
{{- end }}
