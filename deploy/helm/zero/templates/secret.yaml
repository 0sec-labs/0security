{{- if and (not .Values.secrets.existingSecret) .Values.secrets.accessToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zero.fullname" . }}
  labels:
    {{- include "zero.labels" . | nindent 4 }}
type: Opaque
stringData:
  ZERO_ACCESS_TOKEN: {{ .Values.secrets.accessToken | quote }}
{{- end }}
